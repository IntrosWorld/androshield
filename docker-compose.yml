services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apk_fraud
      POSTGRES_USER: apk_fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apk_fraud -d apk_fraud"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  analyzer:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Pass through from your shell/.env (all optional — app runs without them).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - VT_API_KEY=${VT_API_KEY:-}
      - DATABASE_URL=postgresql://apk_fraud:${POSTGRES_PASSWORD:-change-me-for-production}@postgres:5432/apk_fraud
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
